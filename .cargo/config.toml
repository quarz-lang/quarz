# The tests run their programs on one worker thread, where the order of
# tasks' output is deterministic; those meant for several workers
# (crates/quarz-cli/tests/threads.rs) set QUARZ_THREADS themselves. A
# QUARZ_THREADS already in the environment wins. (This also applies to
# `cargo run`; run target/*/quarz directly for the default, one worker
# per CPU.)
[env]
QUARZ_THREADS = "1"
# What the checker keeps between runs (docs/05 §2) goes under target/ for
# the tests and `cargo run`, not the user's cache.
QUARZ_CACHE_DIR = { value = "target/quarz-cache", relative = true }
# The interpreter checks the facts compiled code trusts (crates/quarz-vm/
# src/verify.rs) in every test and `cargo run`.
QUARZ_VERIFY = "1"
