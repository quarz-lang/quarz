[workspace]
resolver = "2"
members = [
    "crates/quarz-syntax",
    "crates/quarz-types",
    "crates/quarz-vm",
    "crates/quarz-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/shugo/quarz"

[workspace.dependencies]
quarz-syntax = { path = "crates/quarz-syntax" }
quarz-types = { path = "crates/quarz-types" }
quarz-vm = { path = "crates/quarz-vm" }
