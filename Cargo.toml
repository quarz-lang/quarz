[workspace]
resolver = "2"
members = [
    "crates/quarz-syntax",
    "crates/quarz-types",
    "crates/quarz-ir",
    "crates/quarz-lower",
    "crates/quarz-vm",
    "crates/quarz-aot",
    "crates/quarz-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# `f64::next_up` (Float#next_float) needs 1.86; the dependencies need 1.85.
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/shugo/quarz"

[workspace.dependencies]
quarz-syntax = { path = "crates/quarz-syntax" }
quarz-types = { path = "crates/quarz-types" }
quarz-ir = { path = "crates/quarz-ir" }
quarz-lower = { path = "crates/quarz-lower" }
quarz-vm = { path = "crates/quarz-vm" }
quarz-aot = { path = "crates/quarz-aot" }
