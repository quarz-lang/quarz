[workspace]
resolver = "2"
members = [
    "crates/quarz-syntax",
    "crates/quarz-types",
    "crates/quarz-ir",
    "crates/quarz-lower",
    "crates/quarz-vm",
    "crates/quarz-aot",
    "crates/quarz-cog",
    "crates/quarz-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Raised to 1.96 for Cranelift 0.136, since removed; not lowered (CI
# checks this version, and nothing older is tested).
rust-version = "1.96"
license = "MIT-0"
repository = "https://github.com/quarz-lang/quarz"

[workspace.dependencies]
quarz-syntax = { path = "crates/quarz-syntax" }
quarz-types = { path = "crates/quarz-types" }
quarz-ir = { path = "crates/quarz-ir" }
quarz-lower = { path = "crates/quarz-lower" }
quarz-vm = { path = "crates/quarz-vm", default-features = false }
quarz-aot = { path = "crates/quarz-aot" }
quarz-cog = { path = "crates/quarz-cog" }

# The runtime (the interpreter, and the library compiled programs link)
# as one codegen unit: faster, and its inlining no longer shifts with
# how unrelated code is split into units (as Ruff does for its parser).
[profile.release.package.quarz-vm]
codegen-units = 1
