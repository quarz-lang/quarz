[workspace]
resolver = "2"
members = [
    "crates/quarz-syntax",
    "crates/quarz-types",
    "crates/quarz-ir",
    "crates/quarz-lower",
    "crates/quarz-vm",
    "crates/quarz-aot",
    "crates/quarz-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Cranelift 0.136 needs 1.96 (gimli 0.34 needs 1.88).
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/shugo/quarz"

[workspace.dependencies]
quarz-syntax = { path = "crates/quarz-syntax" }
quarz-types = { path = "crates/quarz-types" }
quarz-ir = { path = "crates/quarz-ir" }
quarz-lower = { path = "crates/quarz-lower" }
quarz-vm = { path = "crates/quarz-vm" }
quarz-aot = { path = "crates/quarz-aot" }
