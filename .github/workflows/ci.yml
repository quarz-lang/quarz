# Build and test every push and pull request. `cargo build` runs before
# `cargo test` on purpose: the compiled-code tests link the runtime
# library (`target/debug/libquarz_vm.a`) that only a build produces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Toolchain for the LLVM backend
        run: clang --version
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      # The standard library's API reference is published from main by
      # docs.yml (https://api.quarz.dev/); here its links are checked, so
      # a pull request that breaks them fails.
      - name: Check the standard library's docs
        run: ./target/debug/quarz doc --std --check

  msrv:
    name: Check (Rust 1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins `stable` and takes precedence over the
      # default toolchain the action sets; RUSTUP_TOOLCHAIN overrides it.
      - run: cargo check --workspace --all-targets
        env:
          RUSTUP_TOOLCHAIN: "1.96"
      - run: rustc --version
        env:
          RUSTUP_TOOLCHAIN: "1.96"

  # The Lean model of the checker's core (formal/README.md): the proofs
  # (and no `sorry` under them), the random test, and the differential
  # test against the Rust checker.
  formal:
    name: Formal (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: formal/quarz-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The toolchain `lean-toolchain` names, from the GitHub release
      # (elan's own source, releases.lean-lang.org, is not reachable from
      # the runners), linked as formal/README.md's Setup describes.
      - name: Lean version
        id: lean
        run: echo "version=$(sed 's|^leanprover/lean4:||' lean-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: lean-toolchain
        with:
          path: ~/.elan/manual/lean
          key: lean-toolchain-${{ steps.lean.outputs.version }}
      - name: Download the Lean toolchain
        if: steps.lean-toolchain.outputs.cache-hit != 'true'
        run: |
          v="${{ steps.lean.outputs.version }}"
          mkdir -p ~/.elan/manual/lean
          curl -sSfL "https://github.com/leanprover/lean4/releases/download/$v/lean-${v#v}-linux.tar.zst" |
            tar --zstd -x --strip-components=1 -C ~/.elan/manual/lean
      - name: Link the Lean toolchain
        run: |
          elan toolchain link "leanprover/lean4:${{ steps.lean.outputs.version }}" ~/.elan/manual/lean
          lean --version
      - uses: actions/cache@v6
        with:
          path: formal/quarz-core/.lake
          key: lake-${{ hashFiles('formal/quarz-core/lean-toolchain', 'formal/quarz-core/lake-manifest.json') }}
      - name: Build
        run: lake build
      - name: No sorry
        run: "! lake env lean Axioms.lean | grep sorryAx"
      - name: Random programs
        run: lake exe fuzz 20000
      - name: Build quarz
        run: cargo build -p quarz-cli
        working-directory: .
      - name: Conformance
        run: ./conformance.sh
