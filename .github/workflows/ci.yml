# Build and test every push and pull request. `cargo build` runs before
# `cargo test` on purpose: the compiled-code tests link the runtime
# library (`target/debug/libquarz_vm.a`) that only a build produces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of its previous head
# (#1048); runs on main are grouped by commit, so none cancels another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository (#1008's job reads another).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The compiled tests at the level users get (.cargo/config.toml has 0
  # for local runs): CI is what catches a bug only the optimizer shows.
  QUARZ_AOT_OPT: "2"

jobs:
  # Format, lint and the standard library's docs: apart from the tests, so
  # that they run beside them.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Caches are saved from main only: the repository's caches are over
      # GitHub's limit, and a pull request's would evict main's.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The standard library's API reference is published from main by
      # docs.yml (https://api.quarz.dev/); here its links are checked, so
      # a pull request that breaks them fails.
      - name: Check the standard library's docs
        run: cargo run -q --bin quarz -- doc --std --check

  # The tests, in five jobs run side by side (#453, #1048): `tests/std.rs`
  # in one; `tests/build.rs` in two, the second taking only its three
  # fixture loops, which each compile their half of the fixtures
  # (`QUARZ_TEST_SHARD`, every fixture in exactly one shard); every other
  # test (cargo-nextest's) in two partitions, the doc tests in the first.
  # The jobs share one cache (`shared-key`), saved by one of them.
  #
  # A pull request that changes only documentation (`docs/**`, `*.md`)
  # runs none of a job's steps after the decision, and the job passes:
  # its check is still reported under its name, which a skipped job
  # (`if:` on the job) would not keep for a matrix.
  test:
    name: Test (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [std, build-1, build-2, rest-1, rest-2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base it merges
          # into: what the pull request changes.
          fetch-depth: 2
      - name: Decide whether the change needs the tests
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation: a file under `docs/`, or a `.md` outside
          # `crates/`, `std/` and `examples/` (the top-level ones,
          # `bench/`, `formal/`, `.claude/`); a `.md` under those three may
          # be a test's input (`tests/doc_cmd/app/README.md`). Any other
          # file needs the tests. `--no-renames` lists a renamed file by
          # both of its paths, so a move out of `docs/` into code counts.
          code=$(git diff --name-only --no-renames HEAD^1 HEAD | awk '
            /^docs\// { next }
            /\.md$/ && !/^(crates|std|examples)\// { next }
            { print }')
          if [ -n "$code" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed: the tests are not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
        with:
          shared-key: test
          save-if: ${{ matrix.part == 'rest-1' && github.ref == 'refs/heads/main' }}
      - name: Toolchain for the LLVM backend
        if: steps.changes.outputs.run == 'true'
        run: clang --version
      - name: Build
        if: steps.changes.outputs.run == 'true'
        run: cargo build --workspace
      - name: Test std.rs
        if: steps.changes.outputs.run == 'true' && matrix.part == 'std'
        run: cargo test -p quarz-cli --test std
      # The examples of the guide at quarz.dev (quarz-lang/quarz.dev's
      # `scripts/check_guide.qz`, run on the site's main) with this
      # change's `quarz`, the one the step above built (#1008). A warning,
      # not a failure: a change that breaks an example on purpose is
      # followed by the site's pull request, which the summary names the
      # blocks for. After the tests, so that the site's checkout is not
      # in the tree they read.
      - name: Check out the site's guide
        if: steps.changes.outputs.run == 'true' && matrix.part == 'std' && !cancelled()
        uses: actions/checkout@v7
        with:
          repository: quarz-lang/quarz.dev
          ref: main
          path: quarz.dev
          persist-credentials: false
      - name: The guide's examples (a warning, not a failure)
        if: steps.changes.outputs.run == 'true' && matrix.part == 'std' && !cancelled()
        continue-on-error: true
        working-directory: quarz.dev
        run: |
          quarz="$GITHUB_WORKSPACE/target/debug/quarz"
          if "$quarz" run scripts/check_guide.qz "$quarz" > guide.log 2>&1; then
            tail -n 1 guide.log
            exit 0
          fi
          {
            echo "### The guide's examples at quarz.dev"
            echo
            echo "This change breaks examples of quarz-lang/quarz.dev's guide (checked on the site's main). If that is meant, update them in a pull request there, beside this one:"
            echo
            echo '```'
            cat guide.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=The guide's examples::$(tail -n 1 guide.log) (see the job summary)"
          exit 1
      # The first shard also runs build.rs' other tests; the second only
      # the fixture loops (the tests whose names end in `match_the_vm`).
      # `--nocapture` shows each shard's list of fixtures.
      - name: Test build.rs (shard 1 of 2)
        if: steps.changes.outputs.run == 'true' && matrix.part == 'build-1'
        env:
          QUARZ_TEST_SHARD: "1/2"
        run: cargo test -p quarz-cli --test build -- --nocapture
      - name: Test build.rs (shard 2 of 2)
        if: steps.changes.outputs.run == 'true' && matrix.part == 'build-2'
        env:
          QUARZ_TEST_SHARD: "2/2"
        run: cargo test -p quarz-cli --test build -- --nocapture match_the_vm
      # The rest through cargo-nextest (#456), in two partitions by test
      # (`hash:`, stable as tests are added): every test of every other
      # binary on one scheduler, binaries side by side, then, in the
      # first, the doc tests, which nextest does not run. Its filter
      # leaves out std and build by name, so a new test file runs here
      # without being listed.
      - name: Install cargo-nextest
        if: steps.changes.outputs.run == 'true' && startsWith(matrix.part, 'rest-')
        uses: taiki-e/install-action@nextest
      - name: Test the rest
        if: steps.changes.outputs.run == 'true' && startsWith(matrix.part, 'rest-')
        run: |
          cargo nextest run --workspace --no-fail-fast \
            --partition "hash:${{ matrix.part == 'rest-1' && '1' || '2' }}/2" \
            -E 'not (binary_id(quarz-cli::std) | binary_id(quarz-cli::build))'
      - name: Doc tests
        if: steps.changes.outputs.run == 'true' && matrix.part == 'rest-1'
        run: cargo test --workspace --doc

  msrv:
    name: Check (Rust 1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins `stable` and takes precedence over the
      # default toolchain the action sets; RUSTUP_TOOLCHAIN overrides it.
      - run: cargo check --workspace --all-targets
        env:
          RUSTUP_TOOLCHAIN: "1.96"
      - run: rustc --version
        env:
          RUSTUP_TOOLCHAIN: "1.96"

  # The Lean model of the checker's core (formal/README.md): the proofs
  # (and no `sorry` under them), the random test, and the differential
  # test against the Rust checker.
  formal:
    name: Formal (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: formal/quarz-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The toolchain `lean-toolchain` names, from the GitHub release, run
      # directly from its `bin/` (#459: no elan, whose own download from
      # GitHub's releases failed the job with 504s; elan's source,
      # releases.lean-lang.org, is not reachable from the runners).
      - name: Lean version
        id: lean
        run: echo "version=$(sed 's|^leanprover/lean4:||' lean-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: lean-toolchain
        with:
          path: ~/.lean-toolchain
          key: lean-toolchain-${{ steps.lean.outputs.version }}
      # On a miss: retried through transient errors, and once more after
      # a minute.
      - name: Download the Lean toolchain
        if: steps.lean-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          v="${{ steps.lean.outputs.version }}"
          url="https://github.com/leanprover/lean4/releases/download/$v/lean-${v#v}-linux.tar.zst"
          get() {
            rm -rf ~/.lean-toolchain && mkdir -p ~/.lean-toolchain &&
              curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 "$url" |
              tar --zstd -x --strip-components=1 -C ~/.lean-toolchain
          }
          get || { sleep 60; get; }
      - name: Put the Lean toolchain on the path
        run: |
          echo "$HOME/.lean-toolchain/bin" >> "$GITHUB_PATH"
          "$HOME/.lean-toolchain/bin/lean" --version
      - uses: actions/cache@v6
        with:
          path: formal/quarz-core/.lake
          key: lake-${{ hashFiles('formal/quarz-core/lean-toolchain', 'formal/quarz-core/lake-manifest.json') }}
      - name: Build
        run: lake build
      - name: No sorry
        run: "! lake env lean Axioms.lean | grep sorryAx"
      - name: Random programs
        run: lake exe fuzz 20000
      - name: Build quarz
        run: cargo build -p quarz-cli
        working-directory: .
      - name: Conformance
        run: ./conformance.sh
