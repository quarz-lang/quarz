# Build and test every push and pull request. `cargo build` runs before
# `cargo test` on purpose: the compiled-code tests link the runtime
# library (`target/debug/libquarz_vm.a`) that only a build produces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format, lint and the standard library's docs: apart from the tests, so
  # that they run beside them.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The standard library's API reference is published from main by
      # docs.yml (https://api.quarz.dev/); here its links are checked, so
      # a pull request that breaks them fails.
      - name: Check the standard library's docs
        run: cargo run -q --bin quarz -- doc --std --check

  # The tests, in three jobs run side by side (#453): the two longest test
  # binaries, `tests/std.rs` and `tests/build.rs`, each in its own, and
  # every other test target in the third. The third takes quarz-cli's
  # test targets from Cargo (`cargo metadata`), so a new test file runs
  # there without being listed. The jobs share one cache (`shared-key`),
  # saved by one of them.
  test:
    name: Test (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [std, build, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.part == 'rest' }}
      - name: Toolchain for the LLVM backend
        run: clang --version
      - name: Build
        run: cargo build --workspace
      - name: Test std.rs
        if: matrix.part == 'std'
        run: cargo test -p quarz-cli --test std
      - name: Test build.rs
        if: matrix.part == 'build'
        run: cargo test -p quarz-cli --test build
      - name: Test the rest
        if: matrix.part == 'rest'
        run: |
          # quarz-cli's test targets as Cargo finds them, but std and build.
          tests=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "quarz-cli") | .targets[]
              | select(.kind | index("test")) | .name
              | select(. != "std" and . != "build")')
          args=()
          for t in $tests; do args+=(--test "$t"); done
          echo "quarz-cli's test targets here: ${tests//$'\n'/ }"
          cargo test --workspace --exclude quarz-cli
          cargo test -p quarz-cli --lib --bins "${args[@]}"
          cargo test -p quarz-cli --doc

  msrv:
    name: Check (Rust 1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins `stable` and takes precedence over the
      # default toolchain the action sets; RUSTUP_TOOLCHAIN overrides it.
      - run: cargo check --workspace --all-targets
        env:
          RUSTUP_TOOLCHAIN: "1.96"
      - run: rustc --version
        env:
          RUSTUP_TOOLCHAIN: "1.96"

  # The Lean model of the checker's core (formal/README.md): the proofs
  # (and no `sorry` under them), the random test, and the differential
  # test against the Rust checker.
  formal:
    name: Formal (Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: formal/quarz-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The toolchain `lean-toolchain` names, from the GitHub release, run
      # directly from its `bin/` (#459: no elan, whose own download from
      # GitHub's releases failed the job with 504s; elan's source,
      # releases.lean-lang.org, is not reachable from the runners).
      - name: Lean version
        id: lean
        run: echo "version=$(sed 's|^leanprover/lean4:||' lean-toolchain)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: lean-toolchain
        with:
          path: ~/.lean-toolchain
          key: lean-toolchain-${{ steps.lean.outputs.version }}
      # On a miss: retried through transient errors, and once more after
      # a minute.
      - name: Download the Lean toolchain
        if: steps.lean-toolchain.outputs.cache-hit != 'true'
        run: |
          v="${{ steps.lean.outputs.version }}"
          url="https://github.com/leanprover/lean4/releases/download/$v/lean-${v#v}-linux.tar.zst"
          get() {
            rm -rf ~/.lean-toolchain && mkdir -p ~/.lean-toolchain &&
              curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 "$url" |
              tar --zstd -x --strip-components=1 -C ~/.lean-toolchain
          }
          get || { sleep 60; get; }
      - name: Put the Lean toolchain on the path
        run: |
          echo "$HOME/.lean-toolchain/bin" >> "$GITHUB_PATH"
          "$HOME/.lean-toolchain/bin/lean" --version
      - uses: actions/cache@v6
        with:
          path: formal/quarz-core/.lake
          key: lake-${{ hashFiles('formal/quarz-core/lean-toolchain', 'formal/quarz-core/lake-manifest.json') }}
      - name: Build
        run: lake build
      - name: No sorry
        run: "! lake env lean Axioms.lean | grep sorryAx"
      - name: Random programs
        run: lake exe fuzz 20000
      - name: Build quarz
        run: cargo build -p quarz-cli
        working-directory: .
      - name: Conformance
        run: ./conformance.sh
