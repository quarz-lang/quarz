# Build and test every push and pull request. `cargo build` runs before
# `cargo test` on purpose: the compiled-code tests link the runtime
# library (`target/debug/libquarz_vm.a`) that only a build produces.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Toolchain for the LLVM backend
        run: clang --version
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  msrv:
    name: Check (Rust 1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
