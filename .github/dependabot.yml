# Weekly updates for the actions the workflows use and for the Cargo
# dependencies. CI runs on every pull request, so an update lands only
# when the build, the lints and the tests pass with it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs (`@stable`, `@1.86`) name Rust toolchains, not versions
      # of the action: `@1.86` is the minimum supported Rust version.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Compatible updates together; an incompatible one (a new major
      # version, or a new 0.x minor) gets its own pull request, so that
      # one which needs code changes (or a newer Rust than 1.86) does
      # not hold back the others.
      cargo-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
