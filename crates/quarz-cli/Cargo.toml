[package]
name = "quarz-cli"
description = "The quarz command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quarz"
path = "src/main.rs"

[dependencies]
quarz-syntax = { workspace = true }
quarz-types = { workspace = true }
quarz-vm = { workspace = true }
quarz-ir = { workspace = true }
quarz-lower = { workspace = true }
quarz-aot = { workspace = true }
# Line editing and history for `quarz repl` (no default features: the
# history file is the only one needed, and the home directory is $HOME).
rustyline = { version = "19", default-features = false, features = ["with-file-history", "derive"] }
