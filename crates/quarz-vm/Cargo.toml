[package]
name = "quarz-vm"
description = "The Quarz runtime and VM: values, QIR interpreter, scheduler and native methods"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
quarz-ir = { workspace = true }
corosensei = "0.3"
indexmap = "2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
rustc-hash = "2"
chrono = "0.4"
smallvec = "1"
