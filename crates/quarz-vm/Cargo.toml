[package]
name = "quarz-vm"
description = "The Quarz runtime and VM: values, QIR interpreter, scheduler and native methods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
quarz-ir = { workspace = true }
gimli = { version = "0.34", default-features = false, features = ["read"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
corosensei = "0.3"
indexmap = "2"
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "perf", "unicode"] }
rustc-hash = "2"
chrono = "0.4"
smallvec = "1"
unicode-segmentation = "1"
polling = "3"
# `std/digest.qz` and `std/base64.qz`.
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
md5 = { package = "md-5", version = "0.11" }
base64 = "0.23"
# `std/tls.qz` (the `tls` feature): rustls with ring as its crypto
# provider (no cmake), and the system's root certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# `std/crypto.qz` (the `crypto` feature): RustCrypto's RSA. Its 0.10
# line is the one on `sha2` 0.11 (0.9 is on 0.10) and constant-time
# (RUSTSEC-2023-0071): pinned while it is a release candidate (#357: move
# to 0.10.0 when it is released).
rsa = { version = "=0.10.0-rc.21", default-features = false, features = ["std", "encoding"], optional = true }
rand = { version = "0.10", optional = true }
pem-rfc7468 = { version = "1", features = ["alloc"], optional = true }
# AES-GCM (`Crypto::AES::GCM`), on the same crypto-common/rand_core line
# as `rsa`; `getrandom` for `Crypto.random_bytes`.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"], optional = true }
getrandom = { version = "0.4", optional = true }
# argon2id password hashes (`Crypto::Argon2`), on the same
# password-hash/rand_core line; its PHC strings come from `password-hash`.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"], optional = true }
# To clear the copy of a password the helper thread hashes.
zeroize = { version = "1", optional = true }
# The allocator (see `src/alloc.rs`): C sources built with the system's
# compiler.
# Pinned with libmimalloc-sys: `alloc.rs` sets an option by its number in
# the bundled mimalloc's enum (check it when updating).
mimalloc = { version = "=0.1.52", optional = true }
libmimalloc-sys = { version = "=0.1.49", features = ["extended"], optional = true }

[features]
default = ["mimalloc", "tls", "crypto"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# TLS (`TLSSocket`, `std/tls.qz`): without it, connecting raises.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:openssl-probe"]
# RSA, AES-GCM, argon2id and random bytes (`std/crypto.qz`): without
# it, they raise.
crypto = ["dep:rsa", "dep:rand", "dep:pem-rfc7468", "dep:aes-gcm", "dep:getrandom", "dep:argon2", "dep:zeroize"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Where the `tls` feature says it looked for the system's certificates.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
openssl-probe = { version = "0.2", optional = true }
