[package]
name = "quarz-vm"
description = "The Quarz runtime and VM: values, QIR interpreter, scheduler and native methods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
quarz-ir = { workspace = true }
gimli = { version = "0.34", default-features = false, features = ["read"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
corosensei = "0.3"
indexmap = "2"
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "perf", "unicode"] }
rustc-hash = "2"
chrono = "0.4"
smallvec = "1"
unicode-segmentation = "1"
glob = "0.3"
polling = "3"
# `std/digest.qz` and `std/base64.qz`.
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
md5 = { package = "md-5", version = "0.11" }
base64 = "0.23"
# `std/tls.qz` (the `tls` feature): rustls with ring as its crypto
# provider (no cmake), and the system's root certificates.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# The allocator (see `src/alloc.rs`): C sources built with the system's
# compiler.
# Pinned with libmimalloc-sys: `alloc.rs` sets an option by its number in
# the bundled mimalloc's enum (check it when updating).
mimalloc = { version = "=0.1.52", optional = true }
libmimalloc-sys = { version = "=0.1.49", features = ["extended"], optional = true }

[features]
default = ["mimalloc", "tls"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# TLS (`TLSSocket`, `std/tls.qz`): without it, connecting raises.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:openssl-probe"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Where the `tls` feature says it looked for the system's certificates.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
openssl-probe = { version = "0.2", optional = true }
